name: Build Next.js Docker image

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
    paths:
      - "nextjs/**"
      - "packages/enrollmate-contract/**"
      - ".github/**"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mihc-nextjs

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Normalize image name
        id: image
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=sha-${{ github.sha }}

      - name: Extract database-release Docker metadata
        id: release-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}-db-release
          tags: |
            type=raw,value=sha-${{ github.sha }}

      - name: Verify Next.js image builds
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./nextjs/Dockerfile
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
          cache-from: type=gha,scope=nextjs-app
          cache-to: type=gha,mode=max,scope=nextjs-app

      - name: Verify database-release image builds
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./nextjs/Dockerfile
          target: database-release
          push: false
          tags: ${{ steps.release-meta.outputs.tags }}
          labels: ${{ steps.release-meta.outputs.labels }}
          cache-from: type=gha,scope=nextjs-db-release
          cache-to: type=gha,mode=max,scope=nextjs-db-release

      - name: Publish database-release immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./nextjs/Dockerfile
          target: database-release
          push: true
          tags: ${{ steps.release-meta.outputs.tags }}
          labels: ${{ steps.release-meta.outputs.labels }}
          cache-from: type=gha,scope=nextjs-db-release

      - name: Publish Next.js immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./nextjs/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
          cache-from: type=gha,scope=nextjs-app
