include:
  - path: services/inngest/compose.yml
  - path: services/pgadmin/compose.yml

services:
  app-postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${APP_POSTGRES_USER:?APP_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${APP_POSTGRES_PASSWORD:?APP_POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${APP_POSTGRES_DB:?APP_POSTGRES_DB is required}
    volumes:
      - app-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_POSTGRES_USER} -d ${APP_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  nextjs:
    image: ghcr.io/markvalenzuela-mmdc/mihc-nextjs:latest
    restart: unless-stopped
    env_file: .env.deploy
    ports:
      - "3000:3000"
    depends_on:
      app-postgres:
        condition: service_healthy
      inngest:
        condition: service_healthy

  playwright:
    image: mihc-playwright:build
    build:
      context: ../playwright
      dockerfile: Dockerfile
    env_file: .env.deploy
    environment:
      INNGEST_DEV: "0"
      PORT: "3939"
    expose:
      - "3939"
    depends_on:
      app-postgres:
        condition: service_healthy
      inngest-redis:
        condition: service_healthy
      inngest:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3939/health').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  app-postgres-data:

