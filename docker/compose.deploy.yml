include:
  - path: services/pgdog-postgres/compose.yml
  - path: services/inngest/compose.yml
  - path: services/pgadmin/compose.yml

services:
  db-release:
    image: ghcr.io/markvalenzuela-mmdc/mihc-nextjs-db-release:${MIHC_IMAGE_TAG:?MIHC_IMAGE_TAG is required}
    restart: "no"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
      PROD_MAINTAINER_NAME: ${PROD_MAINTAINER_NAME:?PROD_MAINTAINER_NAME is required}
      PROD_MAINTAINER_EMAIL: ${PROD_MAINTAINER_EMAIL:?PROD_MAINTAINER_EMAIL is required}
      PROD_MAINTAINER_PASSWORD: ${PROD_MAINTAINER_PASSWORD:?PROD_MAINTAINER_PASSWORD is required}
    depends_on:
      app-pgdog:
        condition: service_started

  nextjs:
    image: ghcr.io/markvalenzuela-mmdc/mihc-nextjs:${MIHC_IMAGE_TAG:?MIHC_IMAGE_TAG is required}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL is required}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
      INNGEST_EVENT_KEY: ${INNGEST_EVENT_KEY:?INNGEST_EVENT_KEY is required}
      INNGEST_BASE_URL: ${INNGEST_BASE_URL:?INNGEST_BASE_URL is required}
      INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY:?INNGEST_SIGNING_KEY is required}
    ports:
      - "3000:3000"
    depends_on:
      db-release:
        condition: service_completed_successfully
      app-pgdog:
        condition: service_started
      inngest:
        condition: service_healthy

  playwright:
    image: mihc-playwright:build
    build:
      context: ../playwright
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      INNGEST_BASE_URL: ${INNGEST_BASE_URL:?INNGEST_BASE_URL is required}
      INNGEST_EVENT_KEY: ${INNGEST_EVENT_KEY:?INNGEST_EVENT_KEY is required}
      INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY:?INNGEST_SIGNING_KEY is required}
      INNGEST_DEV: "0"
      PORT: "3939"
    expose:
      - "3939"
    depends_on:
      db-release:
        condition: service_completed_successfully
      app-postgres:
        condition: service_healthy
      app-pgdog:
        condition: service_started
      inngest-redis:
        condition: service_healthy
      inngest:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3939/health').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

