include:
  - path: services/pgdog-postgres/compose.yml
    env_file: services/pgdog-postgres/.env
  - path: services/inngest/compose.yml
    env_file: services/inngest/.env
  - path: services/pgadmin/compose.yml
    env_file: services/pgadmin/.env

services:
  db-release:
    image: mihc-nextjs-db-release:build
    build:
      context: ..
      dockerfile: nextjs/Dockerfile
      target: database-release
    restart: "no"
    env_file: .env.build
    environment:
      NODE_ENV: production
    depends_on:
      app-pgdog:
        condition: service_started

  nextjs:
    image: mihc-nextjs:build
    build:
      context: ..
      dockerfile: nextjs/Dockerfile
    env_file: .env.build
    ports:
      - "3000:3000"
    depends_on:
      db-release:
        condition: service_completed_successfully
      app-pgdog:
        condition: service_started
      inngest:
        condition: service_healthy

  playwright:
    image: mihc-playwright:build
    build:
      context: ..
      dockerfile: playwright/Dockerfile
    env_file: .env.build
    environment:
      INNGEST_DEV: "0"
    expose:
      - "3939"
    depends_on:
      db-release:
        condition: service_completed_successfully
      app-postgres:
        condition: service_healthy
      app-pgdog:
        condition: service_started
      inngest-redis:
        condition: service_healthy
      inngest:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3939/health').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

